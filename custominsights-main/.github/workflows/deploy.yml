name: ShopSense CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'
  DOCKER_IMAGE_NODE: shopsense-node
  DOCKER_IMAGE_FASTAPI: shopsense-fastapi

jobs:
  # ─────────────────────────────────────────
  # JOB 1 – Node.js Express Backend CI
  # ─────────────────────────────────────────
  node-backend-ci:
    name: Node.js Backend – Lint & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Node.js Dependencies
        working-directory: backend
        run: npm ci

      - name: Validate Express Server Syntax
        working-directory: backend
        run: node --check server.js

      - name: Run Node.js API Smoke Tests
        working-directory: backend
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PORT: 5000
        # Start server in background, wait for it, then ping health endpoint
        run: |
          node server.js &
          sleep 5
          curl -f http://localhost:5000/api/products || echo "Products endpoint check"
          kill %1 || true

  # ─────────────────────────────────────────
  # JOB 2 – Python FastAPI Analytics CI
  # ─────────────────────────────────────────
  python-analytics-ci:
    name: Python FastAPI – Pytest Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/python_app/requirements.txt

      - name: Install Python Dependencies
        working-directory: backend/python_app
        run: pip install -r requirements.txt

      - name: Run FastAPI Pytest Suite
        working-directory: backend/python_app
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          ENVIRONMENT: ci
        run: pytest tests/ -v --tb=short --no-header

  # ─────────────────────────────────────────
  # JOB 3 – Docker Build & Validation
  # ─────────────────────────────────────────
  docker-build:
    name: Docker – Build Both Service Images
    runs-on: ubuntu-latest
    needs: [node-backend-ci, python-analytics-ci]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Node.js Express Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: ${{ env.DOCKER_IMAGE_NODE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Python FastAPI Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/python_app
          file: ./backend/python_app/Dockerfile
          push: false
          tags: ${{ env.DOCKER_IMAGE_FASTAPI }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Docker Compose Configuration
        run: docker compose config --quiet

  # ─────────────────────────────────────────
  # JOB 4 – Publish to Registry (CD)
  # ─────────────────────────────────────────
  deploy:
    name: Deploy – Push Images to Registry
    runs-on: ubuntu-latest
    needs: [docker-build]
    # Only run on push to main (not on PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Option A: DockerHub ───────────────
      # Uncomment and configure DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets
      # - name: Login to DockerHub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Option B: GitHub Container Registry ──
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Node.js Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/shopsense-node:latest
            ghcr.io/${{ github.repository_owner }}/shopsense-node:${{ github.sha }}

      - name: Push FastAPI Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./backend/python_app
          file: ./backend/python_app/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/shopsense-fastapi:latest
            ghcr.io/${{ github.repository_owner }}/shopsense-fastapi:${{ github.sha }}

      - name: Deployment Summary
        run: |
          echo "✅ ShopSense deployment complete!"
          echo "Node.js image: ghcr.io/${{ github.repository_owner }}/shopsense-node:${{ github.sha }}"
          echo "FastAPI image: ghcr.io/${{ github.repository_owner }}/shopsense-fastapi:${{ github.sha }}"
