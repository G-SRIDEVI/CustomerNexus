<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Wishlist | Customer Insights Platform</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/toast.css">
  <script src="../js/toast.js"></script>
  <style>
    .wishlist-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 25px;
    }

    .wishlist-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .wishlist-card:hover {
      transform: translateY(-5px);
      border-color: rgba(59, 130, 246, 0.3);
      box-shadow: var(--shadow-glow);
    }

    .btn-delete {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-weight: bold;
      z-index: 10;
      font-size: 14px;
    }

    .btn-delete:hover {
      background: rgba(239, 68, 68, 0.3);
    }

    .card-img-box {
      width: 100%;
      height: 190px;
      background: rgba(255, 255, 255, 0.02);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      cursor: pointer;
      border-bottom: 1px solid var(--card-border);
    }

    .card-img-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .card-details {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-category {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 8px;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
      cursor: pointer;
    }

    .card-price {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 15px;
    }

    .btn-move {
      width: 100%;
      margin-top: auto;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-logo">Customer Insights Platform</div>
      <ul class="sidebar-menu">
        <li><a href="user_dashboard.html">🏠 Dashboard</a></li>
        <li><a href="products.html">🛍 Products</a></li>
        <li class="active"><a href="wishlist.html">❤️ Wishlist</a></li>
        <li><a href="cart.html">🛒 Cart</a></li>
        <li><a href="order_history.html">📦 Orders</a></li>
        <li><a href="profile.html">👤 Profile</a></li>
        <li><a href="#" onclick="logoutUser()">🚪 Logout</a></li>
      </ul>
    </div>

    <!-- Main -->
    <div class="main-wrapper">
      <h1>My Wishlist</h1>

      <div class="wishlist-grid" id="wishlist-grid">
        <!-- Loaded via JS -->
      </div>
    </div>
  </div>

  <script src="../js/user.js"></script>
  <script>
    const userObj = JSON.parse(localStorage.getItem("user"));
    if (!userObj) {
      window.location.href = "user_login.html";
    }

    async function loadWishlistData() {
      try {
        const res = await fetch(`http://localhost:5000/api/wishlist/${userObj._id}`);
        const data = await res.json();
        
        const grid = document.getElementById("wishlist-grid");
        grid.innerHTML = "";

        if (!data.success || !data.items || data.items.length === 0) {
          grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 50px 0; font-size:15px;">Your wishlist is currently empty.</p>`;
          return;
        }

        data.items.forEach(item => {
          const p = item.productId;
          if (!p) return;

          const card = document.createElement("div");
          card.className = "wishlist-card";
          card.innerHTML = `
            <button class="btn-delete" onclick="removeItem('${item._id}')" title="Remove Item">✕</button>
            <div class="card-img-box" onclick="location.href='product_details.html?id=${p._id}'">
              <img src="${p.image || 'https://via.placeholder.com/180'}" alt="${p.productName}">
            </div>
            <div class="card-details">
              <div class="card-category">${p.category}</div>
              <div class="card-title" onclick="location.href='product_details.html?id=${p._id}'" title="${p.productName}">${p.productName}</div>
              <div class="card-price">₹${p.price}</div>
              <button class="btn-primary btn-move" onclick="moveToCart('${p._id}', '${item._id}')">🛒 Move To Cart</button>
            </div>
          `;
          grid.appendChild(card);
        });
      } catch (err) {
        console.error("Wishlist error:", err);
      }
    }

    async function removeItem(wishlistId) {
      try {
        const res = await fetch(`http://localhost:5000/api/wishlist/${wishlistId}`, {
          method: "DELETE"
        });
        const data = await res.json();
        if (data.success) {
          loadWishlistData();
        } else {
          alert("Failed to remove item");
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function moveToCart(productId, wishlistId) {
      try {
        const cartRes = await fetch("http://localhost:5000/api/cart/add", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            userId: userObj._id,
            productId: productId,
            quantity: 1
          })
        });
        const cartData = await cartRes.json();
        
        if (cartData.success) {
          await fetch(`http://localhost:5000/api/wishlist/${wishlistId}`, { method: "DELETE" });
          alert("Item moved to Cart!");
          loadWishlistData();
        } else {
          alert(cartData.message || "Failed to move item to cart");
        }
      } catch (err) {
        console.error(err);
      }
    }

    loadWishlistData();
  </script>
</body>
</html>
