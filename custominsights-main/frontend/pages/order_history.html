<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders | Customer Insights Platform</title>
  <link rel="stylesheet" href="../css/theme.css">
  <style>
    .orders-list {
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    .order-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 15px;
      margin-bottom: 15px;
    }

    .order-meta-info {
      font-size: 14px;
      color: var(--text-muted);
    }

    .order-meta-info strong {
      color: var(--text-main);
    }

    .status-badge {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      color: white;
    }

    .status-processing { background: #3b82f6; }
    .status-shipped { background: #f59e0b; }
    .status-delivered { background: #10b981; }
    .status-cancelled { background: #ef4444; }

    .order-items-list {
      margin-bottom: 20px;
    }

    .order-item-row {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .timeline-container {
      margin: 25px 0;
      padding: 10px 0;
      display: flex;
      justify-content: space-between;
      position: relative;
    }

    .timeline-container::before {
      content: "";
      position: absolute;
      top: 25px;
      left: 10%;
      right: 10%;
      height: 4px;
      background: var(--card-border);
      z-index: 1;
    }

    .timeline-step {
      position: relative;
      z-index: 5;
      text-align: center;
      width: 20%;
    }

    .timeline-dot {
      width: 20px;
      height: 20px;
      background: #cbd5e1;
      border-radius: 50%;
      margin: 0 auto 10px auto;
      border: 4px solid var(--bg-main);
      box-shadow: 0 0 0 1px var(--card-border);
    }

    .timeline-step.active .timeline-dot {
      background: var(--primary);
      box-shadow: 0 0 0 1px var(--primary);
    }

    .timeline-step.active .timeline-label {
      color: var(--text-main);
      font-weight: 600;
    }

    .timeline-label {
      font-size: 12px;
      color: var(--text-muted);
    }

    .order-actions {
      display: flex;
      gap: 12px;
      border-top: 1px solid var(--card-border);
      padding-top: 15px;
      margin-top: 15px;
    }

    .order-actions button {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-cancel {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
    }

    .btn-cancel:hover:not(:disabled) {
      background: rgba(239, 68, 68, 0.3);
    }

    .btn-cancel:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-invoice {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border: 1px solid var(--card-border) !important;
    }

    .btn-invoice:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .btn-reorder {
      background: var(--primary-gradient);
      color: white;
      margin-left: auto;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-logo">Customer Insights Platform</div>
      <ul class="sidebar-menu">
        <li><a href="user_dashboard.html">🏠 Dashboard</a></li>
        <li><a href="products.html">🛍 Products</a></li>
        <li><a href="wishlist.html">❤️ Wishlist</a></li>
        <li><a href="cart.html">🛒 Cart</a></li>
        <li class="active"><a href="order_history.html">📦 Orders</a></li>
        <li><a href="profile.html">👤 Profile</a></li>
        <li><a href="#" onclick="logoutUser()">🚪 Logout</a></li>
      </ul>
    </div>

    <!-- Main -->
    <div class="main-wrapper">
      <h1>My Purchase History</h1>
      
      <div class="orders-list" id="orders-list-container">
        <!-- Loaded dynamically -->
      </div>
    </div>
  </div>

  <script src="../js/user.js"></script>
  <script>
    const userObj = JSON.parse(localStorage.getItem("user"));
    if (!userObj) {
      window.location.href = "user_login.html";
    }

    async function loadOrdersData() {
      try {
        const res = await fetch(`http://localhost:5000/api/orders/user/${userObj._id}`);
        const data = await res.json();
        
        const container = document.getElementById("orders-list-container");
        container.innerHTML = "";

        if (!data.success || !data.orders || data.orders.length === 0) {
          container.innerHTML = `<p style="text-align: center; color: var(--text-muted); padding: 50px 0; font-size: 15px;">You haven't placed any orders yet.</p>`;
          return;
        }

        data.orders.forEach(order => {
          const card = document.createElement("div");
          card.className = "order-card";
          
          const itemsHtml = order.products.map(p => `
            <div class="order-item-row">
              <span style="color:var(--text-main); font-weight:500;">${p.productName} <strong>(x${p.quantity})</strong></span>
              <span style="color:var(--text-muted);">₹${p.price * p.quantity}</span>
            </div>
          `).join("");

          const status = order.orderStatus;
          const statusLower = status.toLowerCase();
          
          const timelineHtml = getTimelineHtml(status);
          const cancelDisabled = (status !== "Processing" && status !== "Pending") ? "disabled" : "";

          card.innerHTML = `
            <div class="order-header">
              <div class="order-meta-info">
                <span>Order ID: <strong>#${order._id}</strong></span><br>
                <span style="font-size:12px; color:var(--text-muted);">Placed on: ${new Date(order.orderDate).toLocaleDateString()}</span>
              </div>
              <span class="status-badge status-${statusLower}">${status}</span>
            </div>

            <div class="order-items-list">
              ${itemsHtml}
            </div>

            <div style="text-align: right; font-weight:bold; font-size:16px; margin-bottom: 20px; color:var(--text-main);">
              Total Paid: <span style="color:var(--primary); font-size: 18px;">₹${order.totalAmount}</span>
            </div>

            ${timelineHtml}

            <div class="order-actions">
              <button class="btn-cancel" onclick="cancelUserOrder('${order._id}')" ${cancelDisabled}>Cancel Order</button>
              <button class="btn-invoice" onclick="printInvoice('${order._id}')">📄 Print Invoice</button>
              <button class="btn-primary btn-reorder" onclick="reorderPurchase('${order._id}')">⚡ Reorder</button>
            </div>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        console.error("Order history error:", err);
      }
    }

    function getTimelineHtml(status) {
      if (status === "Cancelled") {
        return `
          <div style="background:rgba(239, 68, 68, 0.1); border:1px solid rgba(239, 68, 68, 0.2); color:#ef4444; padding: 12px; border-radius:8px; font-size:13px; text-align:center; font-weight:600;">
            This order has been cancelled.
          </div>
        `;
      }

      const steps = ["Pending", "Processing", "Shipped", "Delivered"];
      const currentIdx = steps.indexOf(status);

      return `
        <div class="timeline-container">
          <div class="timeline-step ${currentIdx >= 0 ? 'active' : ''}">
            <div class="timeline-dot"></div>
            <div class="timeline-label">Placed</div>
          </div>
          <div class="timeline-step ${currentIdx >= 1 ? 'active' : ''}">
            <div class="timeline-dot"></div>
            <div class="timeline-label">Processing</div>
          </div>
          <div class="timeline-step ${currentIdx >= 2 ? 'active' : ''}">
            <div class="timeline-dot"></div>
            <div class="timeline-label">Shipped</div>
          </div>
          <div class="timeline-step ${currentIdx >= 3 ? 'active' : ''}">
            <div class="timeline-dot"></div>
            <div class="timeline-label">Delivered</div>
          </div>
        </div>
      `;
    }

    async function cancelUserOrder(orderId) {
      if (!confirm("Are you sure you want to cancel this order?")) return;
      try {
        const res = await fetch(`http://localhost:5000/api/orders/${orderId}/cancel`, {
          method: "PUT"
        });
        const data = await res.json();
        if (data.success) {
          alert("Order cancelled successfully!");
          loadOrdersData();
        } else {
          alert(data.message || "Failed to cancel order");
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function reorderPurchase(orderId) {
      try {
        const res = await fetch("http://localhost:5000/api/orders/reorder", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ orderId, userId: userObj._id })
        });
        const data = await res.json();
        if (data.success) {
          alert("All items added back to your cart!");
          window.location.href = "cart.html";
        } else {
          alert(data.message || "Failed to reorder items");
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function printInvoice(orderId) {
      try {
        const res = await fetch(`http://localhost:5000/api/orders/user/${userObj._id}`);
        const data = await res.json();
        const order = data.orders.find(o => o._id === orderId);
        
        if (!order) return;

        const itemsHtml = order.products.map(p => `
          <tr>
            <td style="padding: 10px; border-bottom:1px solid #ddd;">${p.productName}</td>
            <td style="padding: 10px; border-bottom:1px solid #ddd; text-align:center;">${p.quantity}</td>
            <td style="padding: 10px; border-bottom:1px solid #ddd; text-align:right;">₹${p.price}</td>
            <td style="padding: 10px; border-bottom:1px solid #ddd; text-align:right;">₹${p.price * p.quantity}</td>
          </tr>
        `).join("");

        const printWindow = window.open("", "_blank");
        printWindow.document.write(`
          <html>
            <head>
              <title>Invoice - #${order._id}</title>
              <style>
                body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 40px; color: #333; }
                .invoice-header { display: flex; justify-content: space-between; border-bottom: 2px solid #2563eb; padding-bottom: 20px; margin-bottom: 30px; }
                .title { font-size: 28px; font-weight: bold; color: #2563eb; }
                .invoice-meta { text-align: right; font-size: 14px; line-height: 1.6; }
                .billing-info { margin-bottom: 30px; font-size: 14px; }
                .invoice-table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
                .invoice-table th { background: #f8fafc; padding: 12px; border-bottom: 2px solid #ddd; font-weight: 600; text-align: left; }
                .total-row { text-align: right; font-size: 18px; font-weight: bold; margin-top: 20px; color: #2563eb; }
              </style>
            </head>
            <body>
              <div class="invoice-header">
                <div>
                  <div class="title">Customer Insights Platform Invoice</div>
                  <div style="font-size:12px; margin-top:5px; color:#666;">Thank you for shopping with us!</div>
                </div>
                <div class="invoice-meta">
                  <strong>Invoice Number:</strong> #${order._id.substring(12).toUpperCase()}<br>
                  <strong>Date:</strong> ${new Date(order.orderDate).toLocaleDateString()}<br>
                  <strong>Payment Method:</strong> ${order.paymentMethod}
                </div>
              </div>

              <div class="billing-info">
                <strong>Bill To:</strong><br>
                Name: ${userObj.name || userObj.username}<br>
                Email: ${userObj.email}<br>
              </div>

              <table class="invoice-table">
                <thead>
                  <tr>
                    <th>Item Description</th>
                    <th style="text-align:center;">Qty</th>
                    <th style="text-align:right;">Unit Price</th>
                    <th style="text-align:right;">Total</th>
                  </tr>
                </thead>
                <tbody>
                  ${itemsHtml}
                </tbody>
              </table>

              <div class="total-row">
                Grand Total: ₹${order.totalAmount}
              </div>

              <div style="text-align: center; margin-top: 50px; font-size: 12px; color: #999; border-top: 1px solid #eee; padding-top: 20px;">
                This is a system generated invoice. Customer Insights Platform Inc.
              </div>

              <script>
                window.onload = function() {
                  window.print();
                }
              <\/script>
            </body>
          </html>
        `);
        printWindow.document.close();
      } catch (err) {
        console.error(err);
      }
    }

    loadOrdersData();
  </script>
</body>
</html>
