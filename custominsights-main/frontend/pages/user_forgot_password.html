<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recover Password | Customer Insights Platform</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/toast.css">
  <script src="../js/toast.js"></script>
  <style>
    body {
      background: radial-gradient(circle at top right, rgba(124, 58, 237, 0.08), transparent 40%),
                  radial-gradient(circle at bottom left, rgba(59, 130, 246, 0.08), transparent 40%),
                  #0b0f19;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .forgot-container {
      width: 480px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      border: 1px solid var(--card-border);
      background: rgba(17, 24, 39, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 40px;
    }

    h2 {
      text-align: center;
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .desc-text {
      font-size: 14px;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .btn-submit {
      width: 100%;
      margin-top: 15px;
    }

    .info-box {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      color: #10b981;
      padding: 15px;
      border-radius: 12px;
      font-size: 14px;
      margin-bottom: 20px;
      text-align: center;
      line-height: 1.5;
    }

    .back-login {
      margin-top: 25px;
      text-align: center;
      font-size: 14px;
    }

    .back-login a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .back-login a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="forgot-container">
    <h2>Recover Password</h2>
    
    <!-- State 1: Request Code -->
    <div id="request-section">
      <p class="desc-text">Enter your registered email address, and we'll generate a verification reset code.</p>
      
      <div class="form-group">
        <label class="input-label">Email Address</label>
        <input type="email" id="email" class="input-field" placeholder="name@domain.com">
      </div>
      
      <button onclick="requestCode()" class="btn-primary btn-submit">Request Reset Code</button>
    </div>

    <!-- State 2: Reset Password -->
    <div id="reset-section" style="display: none;">
      <div id="token-display" class="info-box" style="display: none;"></div>
      <p class="desc-text">Provide the verification code above to create your new password.</p>
      
      <div class="form-group">
        <label class="input-label">Verification Code</label>
        <input type="text" id="reset-token" class="input-field" placeholder="e.g. 123456">
      </div>

      <div class="form-group">
        <label class="input-label">New Password</label>
        <input type="password" id="new-password" class="input-field" placeholder="••••••••">
      </div>
      
      <button onclick="resetPassword()" class="btn-primary btn-submit">Save New Password</button>
    </div>

    <div class="back-login">
      <a href="user_login.html">← Back to Login</a>
    </div>
  </div>

  <script>
    async function requestCode() {
      const email = document.getElementById("email").value.trim();
      if (!email) {
        alert("Please enter your email");
        return;
      }
      try {
        const res = await fetch("http://localhost:5000/api/users/forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById("request-section").style.display = "none";
          document.getElementById("reset-section").style.display = "block";
          
          const infoBox = document.getElementById("token-display");
          infoBox.style.display = "block";
          infoBox.innerHTML = `<strong>Verification Code:</strong> <span style="font-size: 18px; letter-spacing:1px; color:#10b981;">${data.token}</span><br><span style="font-size:11px; opacity:0.8;">(Mock email verification code generated)</span>`;
          alert("A recovery code has been generated! Use the code displayed to set your new password.");
        } else {
          alert(data.message || "Failed to initiate password recovery");
        }
      } catch (err) {
        console.error(err);
        alert("An error occurred");
      }
    }

    async function resetPassword() {
      const token = document.getElementById("reset-token").value.trim();
      const password = document.getElementById("new-password").value.trim();
      if (!token || !password) {
        alert("Please fill in all fields");
        return;
      }
      try {
        const res = await fetch("http://localhost:5000/api/users/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, password })
        });
        const data = await res.json();
        if (data.success) {
          alert("Password updated successfully! Please log in.");
          window.location.href = "user_login.html";
        } else {
          alert(data.message || "Reset failed");
        }
      } catch (err) {
        console.error(err);
        alert("An error occurred");
      }
    }
  </script>
</body>
</html>
