<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | Customer Insights Platform</title>
  <link rel="stylesheet" href="../css/theme.css">
  <style>
    .profile-grid {
      display: flex;
      gap: 30px;
    }

    .left-col {
      flex: 1.2;
    }

    .right-col {
      flex: 1;
    }

    .profile-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      margin-bottom: 25px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 10px;
      color: var(--text-main);
    }

    /* Avatar Display */
    .avatar-wrapper {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    .avatar-circle {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      background: var(--primary-gradient);
      color: white;
      font-size: 34px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      border: 3px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
    }

    .avatar-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Address list management */
    .address-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      border: 1px solid var(--card-border);
      background: rgba(15, 23, 42, 0.4);
      border-radius: 12px;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .btn-remove-address {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
    }

    .add-address-input-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .add-address-input-group input {
      flex: 1;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-logo">Customer Insights Platform</div>
      <ul class="sidebar-menu">
        <li><a href="user_dashboard.html">🏠 Dashboard</a></li>
        <li><a href="products.html">🛍 Products</a></li>
        <li><a href="wishlist.html">❤️ Wishlist</a></li>
        <li><a href="cart.html">🛒 Cart</a></li>
        <li><a href="order_history.html">📦 Orders</a></li>
        <li class="active"><a href="profile.html">👤 Profile</a></li>
        <li><a href="#" onclick="logoutUser()">🚪 Logout</a></li>
      </ul>
    </div>

    <!-- Main -->
    <div class="main-wrapper">
      <h1>My Account Profile</h1>

      <div class="profile-grid">
        <!-- Left Column: Personal info & addresses -->
        <div class="left-col">
          <!-- Personal Info -->
          <div class="profile-card">
            <h3 class="card-title">Personal Details</h3>
            
            <div class="avatar-wrapper">
              <div class="avatar-circle" id="avatar-circle">U</div>
              <div>
                <label style="font-size: 13px; font-weight: 600; display:block; margin-bottom:6px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px;">Avatar Image Link</label>
                <div style="display:flex; gap:10px; align-items:center;">
                  <input type="text" id="avatar-url-input" class="input-field" placeholder="Paste link..." style="padding: 10px; font-size:13px; width: 220px;">
                  <button onclick="updateAvatar()" class="btn-primary" style="padding: 10px 15px; font-size:13px;">Update</button>
                </div>
              </div>
            </div>

            <form id="profile-details-form" onsubmit="saveProfileDetails(event)">
              <div class="form-group">
                <label class="input-label">Email Address</label>
                <input type="email" id="email" class="input-field" readonly>
              </div>

              <div class="form-group">
                <label class="input-label">User Name</label>
                <input type="text" id="username-field" class="input-field" required>
              </div>

              <div class="form-group">
                <label class="input-label">Display Name</label>
                <input type="text" id="name-field" class="input-field">
              </div>

              <div class="form-group">
                <label class="input-label">Phone Number</label>
                <input type="text" id="phone-field" class="input-field">
              </div>

              <div class="form-group">
                <label class="input-label">Loyalty Reward Points 🌟</label>
                <input type="text" id="reward-field" class="input-field" readonly>
              </div>

              <button type="submit" class="btn-primary btn-save">💾 Save Details</button>
            </form>
          </div>

          <!-- Saved Addresses -->
          <div class="profile-card">
            <h3 class="card-title">Address Book</h3>
            <div id="addresses-container">
              <!-- Loaded dynamically -->
            </div>
            
            <div class="add-address-input-group">
              <input type="text" id="new-address-input" class="input-field" placeholder="Enter new address details...">
              <button onclick="addNewAddress()" class="btn-primary" style="padding: 10px 20px;">Add Address</button>
            </div>
          </div>
        </div>

        <!-- Right Column: Change Password -->
        <div class="right-col">
          <div class="profile-card">
            <h3 class="card-title">Change Password</h3>
            <form id="change-password-form" onsubmit="submitPasswordChange(event)">
              <div class="form-group">
                <label class="input-label">Current Password</label>
                <input type="password" id="old-pass" class="input-field" placeholder="••••••••" required>
              </div>

              <div class="form-group">
                <label class="input-label">New Password</label>
                <input type="password" id="new-pass" class="input-field" placeholder="••••••••" required>
              </div>

              <div class="form-group">
                <label class="input-label">Confirm New Password</label>
                <input type="password" id="confirm-pass" class="input-field" placeholder="••••••••" required>
              </div>

              <button type="submit" class="btn-primary btn-save">🔒 Update Password</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Recommended For You Widget -->
      <div class="profile-card" style="margin-top: 30px;">
        <h3 class="card-title">Recommended For You 🛍️</h3>
        <div id="profile-recommendations-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 15px;">
          <p style="color:var(--text-muted); font-size:14px;">Loading recommendations...</p>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/user.js"></script>
  <script>
    async function loadProfileRecommendations() {
      try {
        const currentUserObj = JSON.parse(localStorage.getItem("user"));
        if (!currentUserObj) return;
        const res = await fetch(`http://localhost:5000/api/recommendations?userId=${currentUserObj._id}&limit=4`);
        const data = await res.json();
        const container = document.getElementById("profile-recommendations-container");
        if (!container) return;
        if (data.success && data.products && data.products.length > 0) {
          container.innerHTML = "";
          data.products.forEach(p => {
            const pName = p.productName || p.name;
            const pImg = p.image || "https://via.placeholder.com/150";
            container.innerHTML += `
              <div style="background:rgba(255,255,255,0.03); border:1px solid var(--card-border); border-radius:12px; padding:15px; text-align:center;">
                <img src="${pImg}" alt="${pName}" style="width:100%; height:110px; object-fit:contain; margin-bottom:10px;">
                <h4 style="font-size:14px; color:var(--text-main); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${pName}</h4>
                <p style="color:var(--primary); font-weight:bold; margin:6px 0;">₹${p.price}</p>
                <a href="product_details.html?id=${p._id}" style="font-size:12px; color:var(--primary); font-weight:bold; text-decoration:none;">View Product →</a>
              </div>
            `;
          });
        } else {
          container.innerHTML = `<p style="color:var(--text-muted); font-size:14px;">No recommendations found.</p>`;
        }
      } catch (err) {
        console.error(err);
      }
    }
    loadProfileRecommendations();
  </script>
  <script>
    const user = JSON.parse(localStorage.getItem("user"));
    if (!user) {
      window.location.href = "user_login.html";
    }

    async function loadProfileCenter() {
      try {
        const res = await fetch(`http://localhost:5000/api/users/${user._id}`);
        const data = await res.json();
        
        if (data.success && data.user) {
          const freshUser = data.user;
          localStorage.setItem("user", JSON.stringify({ ...user, ...freshUser }));

          document.getElementById("email").value = freshUser.email || "";
          document.getElementById("username-field").value = freshUser.username || "";
          document.getElementById("name-field").value = freshUser.name || "";
          document.getElementById("phone-field").value = freshUser.phone || "";
          document.getElementById("reward-field").value = `${freshUser.rewardPoints || 0} Points`;

          const avatarDiv = document.getElementById("avatar-circle");
          if (freshUser.profilePicture) {
            avatarDiv.innerHTML = `<img src="${freshUser.profilePicture}" alt="Avatar">`;
            document.getElementById("avatar-url-input").value = freshUser.profilePicture;
          } else {
            avatarDiv.textContent = (freshUser.username || freshUser.email).substring(0, 1).toUpperCase();
            document.getElementById("avatar-url-input").value = "";
          }

          const addrContainer = document.getElementById("addresses-container");
          addrContainer.innerHTML = "";
          const savedAddresses = freshUser.addresses || [];
          
          if (savedAddresses.length === 0) {
            addrContainer.innerHTML = `<p style="font-size:13px; color:var(--text-muted); padding:10px 0;">No saved addresses. Add one below!</p>`;
          } else {
            savedAddresses.forEach(addr => {
              const div = document.createElement("div");
              div.className = "address-item";
              div.innerHTML = `
                <span>${addr}</span>
                <button class="btn-remove-address" onclick="removeAddressItem('${addr}')">Remove</button>
              `;
              addrContainer.appendChild(div);
            });
          }
        }
      } catch (err) {
        console.error("Profile load error:", err);
      }
    }

    async function saveProfileDetails(e) {
      e.preventDefault();
      const username = document.getElementById("username-field").value.trim();
      const name = document.getElementById("name-field").value.trim();
      const phone = document.getElementById("phone-field").value.trim();

      try {
        const res = await fetch(`http://localhost:5000/api/users/${user._id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, name, phone })
        });
        const data = await res.json();
        if (data.success) {
          alert("Profile updated successfully!");
          loadProfileCenter();
        } else {
          alert(data.message || "Failed to update details");
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function updateAvatar() {
      const url = document.getElementById("avatar-url-input").value.trim();
      try {
        const res = await fetch(`http://localhost:5000/api/users/${user._id}/avatar`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ profilePicture: url })
        });
        const data = await res.json();
        if (data.success) {
          alert("Avatar updated!");
          loadProfileCenter();
        } else {
          alert("Failed to update avatar");
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function addNewAddress() {
      const address = document.getElementById("new-address-input").value.trim();
      if (!address) return;
      try {
        const res = await fetch(`http://localhost:5000/api/users/${user._id}/address`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ address })
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById("new-address-input").value = "";
          loadProfileCenter();
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function removeAddressItem(address) {
      if (!confirm("Remove this address?")) return;
      try {
        const res = await fetch(`http://localhost:5000/api/users/${user._id}/address/remove`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ address })
        });
        const data = await res.json();
        if (data.success) {
          loadProfileCenter();
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function submitPasswordChange(e) {
      e.preventDefault();
      const oldPassword = document.getElementById("old-pass").value;
      const newPassword = document.getElementById("new-pass").value;
      const confirmPass = document.getElementById("confirm-pass").value;

      if (newPassword !== confirmPass) {
        alert("New passwords do not match!");
        return;
      }

      try {
        const res = await fetch(`http://localhost:5000/api/users/${user._id}/password`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ oldPassword, newPassword })
        });
        const data = await res.json();
        
        if (data.success) {
          alert("Password updated successfully!");
          document.getElementById("change-password-form").reset();
        } else {
          alert(data.message || "Failed to change password");
        }
      } catch (err) {
        console.error(err);
      }
    }

    loadProfileCenter();
  </script>
</body>
</html>
